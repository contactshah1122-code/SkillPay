<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background Shield/Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Inner Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4" stroke-dasharray="12 12" />
  <!-- Central Sports Crest / Star & Crescent Skill Motif -->
  <!-- Crescent -->
  <path d="M 285 165 A 110 110 0 1 0 350 330 A 130 130 0 1 1 285 165 Z" fill="#ffffff" opacity="0.95" />
  <!-- Star -->
  <polygon points="325,190 335,218 365,218 340,236 350,265 325,248 300,265 310,236 285,218 315,218" fill="url(#gold)" />
  <!-- Skill Lightning / Play Arrow -->
  <path d="M 220 220 L 260 270 L 235 275 L 265 325 L 205 270 L 230 265 Z" fill="url(#gold)" />
  <!-- Label Badge -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">SKILLPLAY PK</text>
</svg>
